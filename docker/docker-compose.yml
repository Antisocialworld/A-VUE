version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg${POSTGRES_VERSION:?POSTGRES_VERSION is required}
    container_name: avue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-avue_db}
      POSTGRES_USER: ${POSTGRES_USER:-avue_user}
      # Fails compose execution if POSTGRES_PASSWORD is unset or empty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in .env}
    ports:
      - '5432:5432'
    volumes:
      - avue_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-avue_user} -d ${POSTGRES_DB:-avue_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: avue-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - avue_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: avue-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP port for sending codes
      - '8025:8025' # Web UI for reading emails locally
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  avue_postgres_data:
    name: avue_postgres_data
  avue_redis_data:
    name: avue_redis_data

